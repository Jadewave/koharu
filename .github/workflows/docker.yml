name: Build Koharu Docker

on:
  push:
    branches:
      - hf-headless
      - main
  pull_request:
    branches:
      - hf-headless
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag koharu-headless:test \
            .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name koharu-headless \
            --publish 7860:7860 \
            koharu-headless:test

      - name: Wait for Koharu
        run: |
          for i in {1..60}; do
            if curl --silent --fail \
              http://127.0.0.1:7860/ > /tmp/koharu.html; then
              exit 0
            fi
            sleep 2
          done

          docker logs koharu-headless
          exit 1

      - name: Test RPC
        run: |
          curl --fail \
            --request POST \
            http://127.0.0.1:7860/rpc/get_project

      - name: Show logs
        if: always()
        run: |
          docker logs koharu-headless || true
