name: Build, Test and Publish Koharu

on:
  push:
    branches:
      - hf-headless
      - main
  pull_request:
    branches:
      - hf-headless
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jadewave/koharu

jobs:
  docker:
    name: Build and test Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag koharu-headless:test \
            .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name koharu-headless \
            --publish 7860:7860 \
            koharu-headless:test

      - name: Wait for Koharu
        run: |
          for i in {1..60}; do
            if curl --silent --fail \
              http://127.0.0.1:7860/ > /tmp/koharu.html; then
              exit 0
            fi

            sleep 2
          done

          docker logs koharu-headless
          exit 1

      - name: Test RPC
        run: |
          curl --fail \
            --request POST \
            http://127.0.0.1:7860/rpc/get_project

      - name: Show logs
        if: always()
        run: |
          docker logs koharu-headless || true

  publish:
    name: Publish image to GHCR
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
